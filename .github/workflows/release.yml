name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0)'
        required: true

permissions:
  contents: read

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: macos-15
    # Publish only tag pushes or manual runs on main; secrets live in the protected "release" environment.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Swift Version
        run: swift --version

      - name: Run Tests
        run: swift test -v

      - name: Determine Release Tag & Extract Changelog
        id: release_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Extract matching section from CHANGELOG.md
          python3 -c "
          import sys, re
          tag = sys.argv[1].lstrip('v')
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = rf'## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
                  with open('release_notes.md', 'w') as out:
                      out.write(notes + '\n')
                  print('Extracted release notes for', tag)
          except Exception as e:
              print('Could not extract notes:', e)
          " "$TAG"
          if [ -s "release_notes.md" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Signing Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE secret is missing; refusing to publish an unsigned release." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD=$(openssl rand -base64 20)
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046 # word splitting of existing keychain list is intended
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          curl -sS https://www.apple.com/certificateauthority/DeveloperIDCA.cer -o "$RUNNER_TEMP/DeveloperIDCA.cer"
          curl -sS https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=== Verify codesigning identities in $KEYCHAIN_PATH ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build Application Bundle
        run: ./scripts/build_app.sh
        env:
          VERSION: ${{ steps.release_info.outputs.tag }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          STRICT_SIGNING: "1"

      - name: Create DMG Installer
        run: ./scripts/create_dmg.sh
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          STRICT_SIGNING: "1"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_BASE64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "Notarization secrets missing; refusing to publish a non-notarized release." >&2
            exit 1
          fi
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$AUTH_KEY_PATH"

          xcrun notarytool submit LightL.dmg \
            --key "$AUTH_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('status')=='Accepted' else 1)" "$RUNNER_TEMP/notary.json"

          # The notary ticket can take a moment to propagate to CloudKit after "Accepted".
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple LightL.dmg && xcrun stapler validate LightL.dmg; then
              exit 0
            fi
            echo "Stapling attempt ${attempt} failed, retrying in 30s..."
            sleep 30
          done
          echo "Stapling failed after retries." >&2
          exit 1

      - name: Verify signatures and Gatekeeper
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          set -euo pipefail
          hdiutil attach LightL.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/dmg" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/LightL.app"
          spctl -a -t exec -vv "$RUNNER_TEMP/dmg/LightL.app"
          spctl -a -t open --context context:primary-signature -vv LightL.dmg
          APP_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/dmg/LightL.app/Contents/Info.plist")
          [ "v${APP_VER}" = "$RELEASE_TAG" ]

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/*.p8 "$RUNNER_TEMP"/*.cer || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: LightL.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: LightL ${{ steps.release_info.outputs.tag }}
          body_path: ${{ steps.release_info.outputs.has_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.release_info.outputs.has_notes != 'true' }}
          files: LightL.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
